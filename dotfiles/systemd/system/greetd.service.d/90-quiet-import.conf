# managed-by: arch-niri-setup
#
# niri-session runs `systemctl --user import-environment` without a variable
# list. Newer systemd prints:
#
#   Calling import-environment without a list of variable names is deprecated.
#
# on the greeter VT before niri starts. Lower the systemd tools' log level for
# the greeter session so the warning stays out of the console; errors still
# show.
[Service]
Environment=SYSTEMD_LOG_LEVEL=err
