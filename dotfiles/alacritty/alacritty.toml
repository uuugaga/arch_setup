# managed-by: arch-niri-setup

[window]
opacity = 0.82
padding = { x = 10, y = 10 }
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.0

[colors.primary]
background = "#0d0f14"
foreground = "#cdd6f4"

[colors.cursor]
text = "#0d0f14"
cursor = "#a6adc8"
