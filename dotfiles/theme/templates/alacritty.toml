# managed-by: arch-niri-setup (generated by theme-from-wallpaper)

[window]
opacity = 0.82
padding = { x = 10, y = 10 }
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.0

[colors.primary]
background = "{{bg}}"
foreground = "{{fg}}"

[colors.cursor]
text = "{{bg}}"
cursor = "{{accent}}"

[colors.selection]
background = "{{surface}}"
text = "{{fg_bright}}"
