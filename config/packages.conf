# shellcheck shell=bash
# Package manifest for arch-niri-setup.
#
# Rules:
#   - Official repositories first. AUR only through paru, never as root.
#   - Keep the core list minimal: compositor, bar, launcher, terminal,
#     portals, audio, network, session, fonts.
#   - Optional modules live in EXTRAS_* and are installed by 50-extras.sh only.
#   - No kitty. The terminal is Alacritty.

# Core packages, installed by 10-packages.sh.
CORE_PKGS=(
  # Build chain required by paru/makepkg and AUR packages.
  base-devel
  git

  # Wayland compositor.
  niri

  # Desktop shell.
  waybar
  fuzzel
  mako
  alacritty

  # Portals, polkit, XWayland.
  xdg-desktop-portal
  xdg-desktop-portal-gnome
  xdg-desktop-portal-gtk
  xwayland-satellite
  polkit-gnome

  # Audio.
  pipewire
  wireplumber
  pipewire-pulse
  pavucontrol

  # Network and Bluetooth.
  networkmanager
  bluez
  bluez-utils
  blueman

  # Session / display manager.
  greetd
  greetd-tuigreet

  # Desktop utilities.
  wl-clipboard
  grim
  slurp
  swappy
  swaybg
  swaylock
  swayidle
  brightnessctl
  playerctl
  jq
  gsimplecal
  nwg-displays

  # Fonts and XDG directories.
  noto-fonts
  noto-fonts-cjk
  ttf-jetbrains-mono-nerd
  xdg-user-dirs
  xdg-utils

  # Wallpaper rotation and dynamic theming.
  awww
  python-pillow
  libnotify

  # Diagnostics and Mesa basics (GPU-specific drivers: 60-gpu.sh).
  pciutils
  mesa
  mesa-utils
)

# Everyday CLI tools. Installed with the core set by 10-packages.sh so a fresh
# machine is usable from the terminal, but kept separate from the desktop
# packages above. zsh is installed as an alternative shell, not made the
# default; `50-extras.sh --zsh` adds Starship and the sample zshrc.
CLI_PKGS=(
  less
  vim
  nano
  htop
  btop
  fastfetch
  tree
  wget
  unzip
  zip
  tmux
  zsh
  cmake
)

# Commands that must exist after the core install.
REQUIRED_COMMANDS=(
  niri
  niri-session
  waybar
  fuzzel
  alacritty
  mako
  greetd
  tuigreet
  xwayland-satellite
  swaybg
  swaylock
  grim
  slurp
  wl-copy
  nmcli
  wpctl
  jq
  nwg-displays
)

# Commands that must exist after the CLI tools above are installed.
CLI_COMMANDS=(
  less
  vim
  nano
  htop
  btop
  fastfetch
  tree
  wget
  unzip
  zip
  tmux
  zsh
  cmake
)

# Optional modules. 50-extras.sh installs only what the caller selects.
EXTRAS_FCITX=(
  fcitx5
  fcitx5-chewing
  fcitx5-configtool
  fcitx5-gtk
  fcitx5-qt
)

EXTRAS_WALLPAPER=(
  awww
  libnotify
)

EXTRAS_APPS_REPO=(
  # Browser / communication / mail
  discord
  spotify-launcher
  bitwarden
  qbittorrent
  tailscale
  thunderbird

  # Development / containers
  docker
  docker-compose
  docker-buildx
  lazydocker

  # Files / media
  nautilus
  mpv
  obs-studio
  imv
  tauon-music-box
)

EXTRAS_APPS_AUR=(
  zen-browser-bin
  visual-studio-code-bin
  parsec-bin
  localsend-bin
)

# Steam and the official-repository gaming stack. Steam lives in [multilib],
# so 50-extras.sh enables that repository before installing this list.
#
# The VM has no hardware Vulkan ICD (VMSVGA/vmwgfx). vulkan-swrast and
# lib32-vulkan-swrast provide Mesa's lavapipe software Vulkan device so Steam
# and Proton can at least enumerate a device; this is diagnostic/light-use
# only, not a playable 3D stack.
EXTRAS_GAMING=(
  steam
  steam-devices
  gamemode
  lib32-gamemode
  mangohud
  lib32-mangohud
  gamescope
  vulkan-tools
  vulkan-swrast
  lib32-vulkan-swrast
  lib32-mesa
  lib32-vulkan-icd-loader
  lib32-libpulse
  lib32-alsa-plugins
  lib32-alsa-lib
  protontricks
  ttf-liberation
)

# Commands that must exist after --gaming. steam-devices is a udev-rules
# package, so it is intentionally not in this list.
GAMING_COMMANDS=(
  steam
  gamemoderun
  mangohud
  gamescope
  vulkaninfo
  protontricks
)

EXTRAS_ZSH=(
  zsh
  starship
  zsh-autosuggestions
  zsh-syntax-highlighting
  zsh-completions
)
