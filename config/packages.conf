# shellcheck shell=bash
# Package manifest for arch-niri-setup.
#
# Rules:
#   - Official repositories first. AUR only through paru, never as root.
#   - Keep the core list minimal: compositor, bar, launcher, terminal,
#     portals, audio, network, session, fonts.
#   - Optional modules live in EXTRAS_* and are installed by 50-extras.sh only.
#   - No kitty. The terminal is Alacritty.

# Core packages, installed by 10-packages.sh.
CORE_PKGS=(
  # Build chain required by paru/makepkg and AUR packages.
  base-devel
  git

  # Wayland compositor.
  niri

  # Desktop shell.
  waybar
  fuzzel
  mako
  alacritty

  # Portals, polkit, XWayland.
  xdg-desktop-portal
  xdg-desktop-portal-gnome
  xdg-desktop-portal-gtk
  xwayland-satellite
  polkit-gnome

  # Audio.
  pipewire
  wireplumber
  pipewire-pulse
  pavucontrol

  # Network and Bluetooth.
  networkmanager
  bluez
  bluez-utils
  blueman

  # Session / display manager.
  greetd
  greetd-tuigreet

  # Desktop utilities.
  wl-clipboard
  grim
  slurp
  swappy
  swaybg
  swaylock
  swayidle
  brightnessctl
  playerctl
  jq
  gsimplecal

  # Fonts and XDG directories.
  noto-fonts
  noto-fonts-cjk
  ttf-jetbrains-mono-nerd
  xdg-user-dirs
  xdg-utils

  # Diagnostics and Mesa basics (GPU-specific drivers: 60-gpu.sh).
  pciutils
  mesa
  mesa-utils
)

# Commands that must exist after the core install.
REQUIRED_COMMANDS=(
  niri
  niri-session
  waybar
  fuzzel
  alacritty
  mako
  greetd
  tuigreet
  xwayland-satellite
  swaybg
  swaylock
  grim
  slurp
  wl-copy
  nmcli
  wpctl
  jq
)

# Optional modules. 50-extras.sh installs only what the caller selects.
EXTRAS_FCITX=(
  fcitx5
  fcitx5-chewing
  fcitx5-configtool
  fcitx5-gtk
  fcitx5-qt
)

EXTRAS_WALLPAPER=(
  awww
  libnotify
)

EXTRAS_APPS_REPO=(
  discord
  spotify-launcher
  bitwarden
  qbittorrent
  docker
  docker-compose
  docker-buildx
  lazydocker
  flatpak
  nautilus
)

EXTRAS_APPS_AUR=(
  zen-browser-bin
)

EXTRAS_GAMING=(
  steam
  gamemode
  mangohud
  lib32-mangohud
  lib32-mesa
  lib32-vulkan-icd-loader
)

EXTRAS_ZSH=(
  zsh
  starship
  zsh-autosuggestions
  zsh-syntax-highlighting
  zsh-completions
)
